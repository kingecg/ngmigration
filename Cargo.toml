[package]
name = "angular-migrator"
version = "0.1.0"
edition = "2021"
description = "Offline-first Angular project migration tool: major-version upgrades with third-party dependency resolution"
license = "MIT"

[features]
default = ["network"]
network = ["dep:ureq"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
glob = "0.3"
walkdir = "2"
ureq = { version = "2", features = ["json"], optional = true }

[dev-dependencies]
tempfile = "3"
walkdir = "2"

[[bin]]
name = "angular-migrator"
path = "src/main.rs"

[profile.release]
lto = true
